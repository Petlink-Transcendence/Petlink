services:
  frontend:
    build: ./frontend
    container_name: petlink_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - core-service

  core-service:
    build: ./backend
    container_name: petlink_core
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8080"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: petlink_db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: petlink_redis
    restart: always
    ports:
      - "6380:6379"

  nginx:
    image: nginx:alpine
    container_name: petlink_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - core-service

  realtime-service:
    build: ./realtime-service
    container_name: petlink_realtime
    command: >
      sh -c "daphne -b 0.0.0.0 -p 8001 core.asgi:application"
    ports:
      - "8001:8001"
    volumes:
      - ./realtime-service:/app
    env_file:
      - .env
    depends_on:
      - redis
      - core-service

volumes:
  postgres_data:
