# Petlink/nginx/nginx.conf

events {
    worker_connections 1024;
}


http {
    client_max_body_size 10M;
    resolver 127.0.0.11 valid=30s ipv6=off;
    # The realtime-service upstream is commented out for now,
    # but ready for Person C to activate next week!
    # upstream realtime_ws {
    #     server realtime-service:8001;
    # }

    server {
        listen 80;
        server_name localhost;

        # Redirect all HTTP requests to HTTPS on port 5173, preserving POST/PUT methods
        return 308 https://$host:5173$request_uri;
    }

    server {
        listen 443 ssl;
        listen 5173 ssl;
        listen 8080 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Redirect non-SSL requests sent to the SSL port to HTTPS on port 5173
        error_page 497 https://$host:5173$request_uri;

        # Route /auth/* to the Django core-service
        location /auth/ {
            proxy_pass http://core-service:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /admin/* to the Django core-service
        location /admin/ {
            proxy_pass http://core-service:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /api/* to the Django core-service
        location /api/ {
            proxy_pass http://core-service:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /ws/* to the ASGI realtime-service (WebSockets)
        location /ws/ {
            set $realtime_ws realtime-service:8001;
            proxy_pass http://$realtime_ws$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /media/posts/ {
            proxy_pass http://realtime-service:8001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route media for saved files (DEBUG=TRUE)
        location /media/ {
            proxy_pass http://core-service:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /static/ {
            proxy_pass http://core-service:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # route for posts
        location /posts/ {
            proxy_pass http://realtime-service:8001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /notifications/<id>/* REST API to the realtime-service.
        # Regex location avoids nginx's prefix-redirect that would intercept
        # the React SPA route /notifications (no trailing slash).
        location ~ ^/notifications/\d {
            proxy_pass http://realtime-service:8001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route all other traffic to the React frontend
        location / {
            proxy_pass http://frontend:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Enable WebSockets support (for Vite hot-reloading)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
